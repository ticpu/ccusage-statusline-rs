name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install cross-compilation tools (windows-gnu)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt -- --check

      - name: Run clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test --release

  # The musl targets build only through the release's Containerfile, so CI tests
  # the toolchain and env that ship instead of a copy that drifts on the runner.
  container:
    name: Build container targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build every container target and the .deb packages
        run: make deb-all DOCKER=docker

      - name: Smoke-test binary
        run: ./dist/ccusage-statusline-rs-linux-x86_64 --version
