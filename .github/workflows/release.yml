name: Release

on:
  push:
    branches:
      - 'ci/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  container-binaries:
    name: Build linux and windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build every container target in one pass
        run: docker build -f Containerfile --output type=local,dest=dist .
        env:
          DOCKER_BUILDKIT: 1

      - name: Check binaries are static
        run: |
          for binary in dist/ccusage-statusline-rs-linux-*; do
            if readelf -l "$binary" | grep -q INTERP; then
              echo "$binary is dynamically linked; the Linux binaries must be static musl" >&2
              readelf -l "$binary" | grep INTERP >&2
              exit 1
            fi
            echo "$binary: static"
          done

      - name: Smoke-test binary
        run: ./dist/ccusage-statusline-rs-linux-x86_64 --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: container-binaries
          path: dist/*

  macos-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: ccusage-statusline-rs-macos-aarch64
          - target: x86_64-apple-darwin
            artifact_name: ccusage-statusline-rs-macos-x86_64
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/ccusage-statusline-rs ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs:
      - container-binaries
      - macos-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          git archive --format=tar --prefix=ccusage-statusline-rs-${VERSION}/ HEAD | xz -c > ccusage-statusline-rs-${VERSION}.tar.xz

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ccusage-statusline-rs-*.tar.xz
            artifacts/*/*
          draft: true
          prerelease: false
          generate_release_notes: true
          append_body: true
          body: |
            The Linux binaries are statically linked against musl, so they carry no
            libc dependency and run on any glibc or musl distribution.
