name: Release

on:
  push:
    branches:
      - 'ci/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  container-binaries:
    name: Build linux and windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # One command builds every container target and packages the Linux ones, so
      # CI and a local `make deb-all` run the same recipe. Packaging asserts what
      # it claims: it refuses a binary carrying an interpreter or a NEEDED entry,
      # which is the check that keeps the Linux binaries static musl.
      - name: Build every container target and the .deb packages
        run: make deb-all DOCKER=docker

      - name: Smoke-test binary
        run: ./dist/ccusage-statusline-rs-linux-x86_64 --version

      # One flat artifact directory: the release job moves artifacts/*/* into place
      # and its globs match names, not paths.
      - name: Collect the packages beside the binaries
        run: mv ccusage-statusline-rs_*.deb dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: container-binaries
          path: dist/*

  macos-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: ccusage-statusline-rs-macos-aarch64
          - target: x86_64-apple-darwin
            artifact_name: ccusage-statusline-rs-macos-x86_64
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/ccusage-statusline-rs ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs:
      - container-binaries
      - macos-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          git archive --format=tar --prefix=ccusage-statusline-rs-${VERSION}/ HEAD | xz -c > ccusage-statusline-rs-${VERSION}.tar.xz

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Published as an asset rather than committed: the checksums of a release can
      # only be known once its assets are built, which is after the tag exists.
      # sign-release.sh signs this file like any other, so it carries the same trust.
      - name: Checksum every asset
        run: |
          mv artifacts/*/* .
          sha256sum ccusage-statusline-rs-*.tar.xz \
                    ccusage-statusline-rs-linux-* \
                    ccusage-statusline-rs-macos-* \
                    ccusage-statusline-rs-windows-* \
                    ccusage-statusline-rs_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ccusage-statusline-rs-*.tar.xz
            ccusage-statusline-rs-linux-*
            ccusage-statusline-rs-macos-*
            ccusage-statusline-rs-windows-*
            ccusage-statusline-rs_*.deb
            SHA256SUMS
          draft: true
          prerelease: false
          generate_release_notes: true
          append_body: true
          body: |
            The Linux binaries are statically linked against musl, so they carry no
            libc dependency and run on any glibc or musl distribution. The .deb
            packages wrap those same binaries and install on any Debian or Ubuntu
            release.
