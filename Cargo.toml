[package]
name = "ccusage-statusline-rs"
version = "1.13.0"
edition = "2024"
rust-version = "1.89"
description = "Claude Code statusline: reconstructs usage from local transcripts, merges it with the claude.ai usage endpoint, renders one line"
license = "MIT"
repository = "https://github.com/ticpu/ccusage-statusline-rs"
homepage = "https://github.com/ticpu/ccusage-statusline-rs"
readme = "README.md"
keywords = ["claude", "claude-code", "statusline", "usage", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
exclude = [
    "/.github",
    "/.claude",
    "/.gitattributes",
    "/.gitignore",
    "/CLAUDE.md",
    "/docs/design-rationale.md",
    "/hooks",
    "/rustfmt.toml",
    "/Containerfile",
    "/Makefile",
    "/PKGBUILD",
    "/benchmark.sh",
    "/sign-release.sh",
    "/packaging",
]

[package.metadata.binstall]
# Release assets are bare binaries, not archives, so pkg-fmt is "bin" and there is
# no bin-dir. Every target names its asset explicitly: the arch strings in the asset
# names are not derivable from binstall's template keys, and a base pkg-url using
# them resolves to nothing and silently falls back to building from source.
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

# The Linux assets are static musl builds, so one binary serves gnu and musl hosts.
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
owo-colors = "4.1"
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
clap = { version = "4.5", features = ["derive"] }
semver = "1.0"
inquire = "0.9"
dunce = "1.0"
path-slash = "0.2"
which = "8"
tempfile = "3.27"
memchr = "2.8"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# musl's mallocng costs ~16% on the transcript parse against glibc's malloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

